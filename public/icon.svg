<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Deep techno gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Upgrade Blue Circuit Glow -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <!-- Mechamorph Eye Radial Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#031535" />
    </radialGradient>

    <!-- Clip Path for the Bold 'E' -->
    <clipPath id="eClip">
      <path d="M 120 80 H 400 V 160 H 200 V 216 H 360 V 296 H 200 V 352 H 400 V 432 H 120 Z" />
    </clipPath>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E2638" stroke-width="4" />

  <!-- Subtle ambient blue core behind the E -->
  <circle cx="256" cy="256" r="160" fill="#0A84FF" opacity="0.08" filter="blur(30px)" />

  <!-- The Bold 'E' Shape Container (filled with Upgrade Mechamorph Circuitry) -->
  <g clip-path="url(#eClip)">
    <!-- Base dark metallic fill for the E body -->
    <rect x="0" y="0" width="512" height="512" fill="#0C101A" />
    
    <!-- Upgrade Cybernetic Circuit Lines (Glowing Blue & White) -->
    <g stroke="url(#circuitGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
      <!-- Main vertical spine circuit -->
      <path d="M160 80 V432" stroke-width="12" stroke="#FFFFFF" />
      <path d="M140 100 V400" stroke-width="4" stroke="#00F0FF" />
      <path d="M180 120 V380" stroke-width="6" stroke="#0A84FF" />
      
      <!-- Top horizontal branches -->
      <path d="M160 120 H360" stroke-width="10" stroke="#FFFFFF" fill="none" />
      <path d="M160 140 H380" stroke-width="6" stroke="#38BDF8" fill="none" />
      
      <!-- Middle horizontal branches -->
      <path d="M160 256 H320" stroke-width="8" stroke="#38BDF8" fill="none" />
      <path d="M160 276 H300" stroke-width="5" stroke="#0A84FF" fill="none" />
      
      <!-- Bottom horizontal branches -->
      <path d="M160 392 H360" stroke-width="10" stroke="#FFFFFF" fill="none" />
      <path d="M160 372 H380" stroke-width="6" stroke="#38BDF8" fill="none" />

      <!-- Nano-nodes (Galvanic Mechamorph circuit dots) -->
      <circle cx="360" cy="120" r="8" fill="#FFFFFF" />
      <circle cx="380" cy="140" r="6" fill="#00F0FF" />
      <circle cx="320" cy="256" r="7" fill="#FFFFFF" />
      <circle cx="300" cy="276" r="5" fill="#38BDF8" />
      <circle cx="360" cy="392" r="8" fill="#FFFFFF" />
      <circle cx="380" cy="372" r="6" fill="#0A84FF" />
      <circle cx="160" cy="100" r="10" fill="#00F0FF" />
      <circle cx="160" cy="412" r="10" fill="#0A84FF" />
    </g>

    <!-- Central Upgrade Optic Eye in the middle bar -->
    <g transform="translate(240, 256)" filter="url(#neonGlow)">
      <!-- Outer cybernetic ring -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0A84FF" stroke-width="5" stroke-dasharray="8 4" />
      <!-- Middle glowing cyan ring -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" stroke-width="4" />
      <!-- Core glowing white-blue Upgrade eye -->
      <circle cx="0" cy="0" r="13" fill="url(#eyeGlow)" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Crisp Outer Border of the 'E' with neon cyan & white edge -->
  <path d="M 120 80 H 400 V 160 H 200 V 216 H 360 V 296 H 200 V 352 H 400 V 432 H 120 Z" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.9" />
  
  <!-- Subtle highlight apex (top left corner) -->
  <path d="M 140 80 H 120 V 100" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
</svg>
