<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Deep techno gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Upgrade Blue Circuit Glow -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <!-- Mechamorph Eye Radial Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#031535" />
    </radialGradient>

    <!-- Clip Path for the Bold 'A' -->
    <clipPath id="aClip">
      <!-- Outer bold A minus inner triangular counter -->
      <path fill-rule="evenodd" d="M256 56 L432 440 H336 L298 350 H214 L176 440 H80 Z M256 168 L228 274 H284 Z" />
    </clipPath>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E2638" stroke-width="4" />

  <!-- Subtle ambient blue core behind the A -->
  <circle cx="256" cy="256" r="160" fill="#0A84FF" opacity="0.08" filter="blur(30px)" />

  <!-- The Bold 'A' Shape Container (filled with Upgrade Mechamorph Circuitry) -->
  <g clip-path="url(#aClip)">
    <!-- Base dark metallic fill for the A body -->
    <rect x="0" y="0" width="512" height="512" fill="#0C101A" />
    
    <!-- Upgrade Cybernetic Circuit Lines (Glowing Blue & White) -->
    <g stroke="url(#circuitGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
      <!-- Main spine circuit -->
      <path d="M256 60 V160" stroke-width="10" stroke="#FFFFFF" />
      
      <!-- Left diagonal trunk & branches -->
      <path d="M256 90 L180 250 H130 L106 310 V430" stroke-width="8" stroke="#38BDF8" fill="none" />
      <path d="M180 250 V340 H150" stroke-width="6" stroke="#00F0FF" fill="none" />
      <path d="M200 180 H140 L115 240" stroke-width="6" stroke="#0A84FF" fill="none" />
      <path d="M190 320 L150 420" stroke-width="7" stroke="#38BDF8" fill="none" />

      <!-- Right diagonal trunk & branches -->
      <path d="M256 90 L332 250 H382 L406 310 V430" stroke-width="8" stroke="#38BDF8" fill="none" />
      <path d="M332 250 V340 H362" stroke-width="6" stroke="#00F0FF" fill="none" />
      <path d="M312 180 H372 L397 240" stroke-width="6" stroke="#0A84FF" fill="none" />
      <path d="M322 320 L362 420" stroke-width="7" stroke="#38BDF8" fill="none" />

      <!-- Crossbar circuits -->
      <path d="M170 310 H342" stroke-width="8" stroke="#FFFFFF" fill="none" />
      <path d="M200 330 H312" stroke-width="5" stroke="#38BDF8" fill="none" />
      <path d="M230 350 H282" stroke-width="6" stroke="#00F0FF" fill="none" />

      <!-- Nano-nodes (Galvanic Mechamorph circuit dots) -->
      <circle cx="256" cy="70" r="8" fill="#FFFFFF" />
      <circle cx="130" cy="250" r="7" fill="#FFFFFF" />
      <circle cx="382" cy="250" r="7" fill="#FFFFFF" />
      <circle cx="150" cy="340" r="6" fill="#38BDF8" />
      <circle cx="362" cy="340" r="6" fill="#38BDF8" />
      <circle cx="106" cy="310" r="6" fill="#00F0FF" />
      <circle cx="406" cy="310" r="6" fill="#00F0FF" />
      <circle cx="150" cy="420" r="8" fill="#0A84FF" />
      <circle cx="362" cy="420" r="8" fill="#0A84FF" />
      <circle cx="140" cy="180" r="5" fill="#38BDF8" />
      <circle cx="372" cy="180" r="5" fill="#38BDF8" />
    </g>

    <!-- Central Upgrade Optic Eye in the upper apex / crossbar -->
    <g transform="translate(256, 150)" filter="url(#neonGlow)">
      <!-- Outer cybernetic ring -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0A84FF" stroke-width="5" stroke-dasharray="8 4" />
      <!-- Middle glowing cyan ring -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" stroke-width="4" />
      <!-- Core glowing white-blue Upgrade eye -->
      <circle cx="0" cy="0" r="13" fill="url(#eyeGlow)" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Crisp Outer Border of the 'A' with neon cyan & white edge -->
  <path fill-rule="evenodd" d="M256 56 L432 440 H336 L298 350 H214 L176 440 H80 Z M256 168 L228 274 H284 Z" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.9" />
  
  <!-- Subtle highlight apex -->
  <path d="M240 76 L256 56 L272 76" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
</svg>
